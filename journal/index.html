wer-help">点击空白处或按 Esc 关闭</p></div></div></dialog><template id="book-manuscript"><section data-story="title" data-chapter="title" data-label="扉页" data-kind="title"><article data-leaf data-desktop-only class="endpaper-leaf"><div class="exlibris"><span class="eyebrow">EX LIBRIS</span><div class="exlibris-monogram">e.</div><span>这本书属于</span><b>卜文旭 / Eames</b><span class="endpaper-rule"></span><p>探索未知，思考问题，<br>创造可能。</p></div><aside class="reading-guide" aria-label="翻阅说明"><h2>翻阅这本书</h2><dl><div><dt>翻页</dt><dd>点击页边、拖动页角，或按键盘 ← →。</dd></div><div><dt>跳转</dt><dd>用右侧便签返回扉页、目录和各个章节。</dd></div><div><dt>合书</dt><dd>双击书外空白处，或按 Esc。</dd></div></dl></aside><p class="endpaper-note">以作品为线索，以生活为注脚。</p></article><article data-leaf class="title-leaf"><span class="eyebrow">THE PERSONAL BOOK OF EAMES</span><div class="title-group"><span class="title-tiny">一本持续书写的个人作品集</span><h1>探索<br>思考<br>创造<span class="title-period">。</span></h1><p class="title-roman">Explore. Think. Create.</p></div><div class="title-author">卜文旭 <span>/</span> Eames</div><p class="title-intro">你好，我是卜文旭，也叫 Eames。<br>这本书记录了我做过的项目、经历过的尝试，<br class="desktop-break">以及我正在探索的 AI 产品方向。</p><aside class="reading-guide" aria-label="翻阅说明"><h2>翻阅这本书</h2><dl><div><dt>翻页</dt><dd>点击页边、拖动页角，或按键盘 ← →。</dd></div><div><dt>跳转</dt><dd>用右侧便签返回扉页、目录和各个章节。</dd></div><div><dt>合书</dt><dd>双击书外空白处，或按 Esc。</dd></div></dl></aside><button class="text-link title-next" data-go="contents">翻到目录 <span aria-hidden="true">→</span></button></article></section><section data-story="contents" data-chapter="contents" data-label="目录" data-kind="contents"><article data-leaf data-desktop-only class="contents-intro"><span class="eyebrow">A NOTE TO THE READER</span><span class="large-section-number" aria-hidden="true">序</span><h2>从这里，<br>慢慢翻起。</h2><p class="serif-lead">有些答案，在动手之后才出现。</p><p>从软件开发到工程实践，再到 AI 与个人产品，方向在一次次尝试里逐渐清晰。</p><p>这本书把这些片段放在一起。你可以顺着纸页阅读，也可以从感兴趣的章节开始。</p><div class="reading-note"><span>阅读方式</span><p>点击页边，或按键盘 ← → 翻页。<br>也可以拖动页角，亲手翻过这一页。<br>右侧书签随时带你返回目录。</p></div></article><article data-leaf class="contents-leaf"><header class="chapter-heading"><span class="eyebrow">CONTENTS</span><h2>目录<span class="heading-period">。</span></h2></header><ol class="contents-list"><li><button data-go="home"><span class="contents-index">01</span><span class="contents-name">首页<small>A beginning</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="home">—</span></button></li><li><button data-go="about"><span class="contents-index">02</span><span class="contents-name">关于我<small>The person</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="about">—</span></button></li><li><button data-go="growth"><span class="contents-index">03</span><span class="contents-name">成长<small>Along the way</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="growth">—</span></button></li><li><button data-go="experience"><span class="contents-index">04</span><span class="contents-name">经历<small>In practice</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="experience">—</span></button></li><li><button data-go="projects"><span class="contents-index">05</span><span class="contents-name">项目<small>Things made</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="projects">—</span></button></li><li><button data-go="journal"><span class="contents-index">06</span><span class="contents-name">日志<small>Working notes</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="journal">—</span></button></li><li><button data-go="interests"><span class="contents-index">07</span><span class="contents-name">兴趣<small>Outside the frame</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="interests">—</span></button></li><li><button data-go="contact"><span class="contents-index">08</span><span class="contents-name">联系<small>Keep in touch</small></span><span class="contents-dots" aria-hidden="true"></span><span class="contents-page" data-page-for="contact">—</span></button></li></ol><p class="margin-note">八个章节，一条仍在延伸的路。</p></article></section><section data-story="home" data-chapter="home" data-label="首页"><article data-leaf><header class="chapter-heading"><span class="eyebrow">01 / A BEGINNING</span><h2>你好，<br>我是卜文旭。</h2></header><p class="name-line">也可以叫我 <em>Eames</em>。</p><p class="serif-lead">不急于定义自己，<br>先把想法做出来。</p><p>希望向 AI 产品经理方向发展，结合软件开发与工程实践，继续学习和个人项目创作。</p><div class="chapter-footnote"><span>目前关注</span><p>AI 产品 · 软件开发 · 工程实践</p></div><a href="#/about" data-go="about" class="text-link">读一读我的故事 <span>→</span></a></article><article data-leaf><span class="eyebrow">ON THE DESK / 正在做的事</span><a class="featured-work" href="#/project/yingji" data-go="project/yingji"><div class="featured-work-art"><span class="film-perforation" aria-hidden="true"></span><span class="yingji-wordmark">影迹<span>YINGJI</span></span><span class="featured-arrow">↗</span></div><div class="featured-work-caption"><h3>让每一次观影，留下痕迹。</h3><span>个人 Android 应用 / 持续迭代</span></div></a><p>把影视兴趣与个人开发结合。记录看过的作品，整理观影习惯，探索符合习惯的影视推荐。</p><div class="home-notes"><span class="eyebrow">FROM THE NOTEBOOK</span><a href="#/journal/yingji-foundation" data-go="journal/yingji-foundation"><span>基础影视记录功能</span><span aria-hidden="true">↗</span></a><a href="#/journal/yingji-ai" data-go="journal/yingji-ai"><span>AI 能力集成</span><span aria-hidden="true">↗</span></a></div></article></section><section data-story="about" data-chapter="about" data-label="关于我"><article data-leaf class="about-opener"><span class="eyebrow">02 / THE PERSON</span><h2>一个<br>还在探索<br>的人<span class="heading-period">。</span></h2><div class="about-person"><div class="about-portrait"><img src="/eames-book/images/profile/personal-image.jpg" width="1080" height="2400" alt="卜文旭 / Eames 的个人形象" loading="lazy"></div><p class="portrait-caption">卜文旭 / Eames<br><span>从想法，到真实作品。</span></p></div></article><article data-leaf data-flow class="prose"><h2 id="一个还在探索的人">一个还在探索的人</h2>
<p>2022 年，我进入西安建筑科技大学华清学院学习计算机科学与技术。那时的我并没有明确的未来方向。</p>
<p>现在，我希望向 AI 产品经理方向发展。</p>
<p>从软件开发，到机械工程、机器人相关实践，再到 AI，我在不同领域的尝试中逐步寻找自己的方向。</p>
<h2 id="从想法到真实作品">从想法到真实作品</h2>
<p>2023 年参加物流技术创意赛的经历，让我深刻感受到把想法变成真实作品的满足感。在团队项目中，我参与了机械、程序与实物调试。</p>
<p>我享受亲手创造的过程，也希望理解一个产品为什么值得做，以及如何把它真正做出来。</p>
<p>在「大风机关」作品中，我负责舵机控制程序，参与钩爪零件的建模／制作、图像识别调试和整机实践。团队获得了物流技术（起重机）创意赛国家一等奖。</p>
<p><a href="/eames-book/project/crane/">查看「大风机关」</a></p>
<h2 id="独立完成一套软件项目">独立完成一套软件项目</h2>
<p>毕业设计中，我独立完成了「大学生社团管理平台」。项目围绕普通用户、社团用户和管理员三类角色，串联注册、审核、入社申请与活动报名等业务。</p>
<p>从需求分析、数据库设计到前后端实现与联调，留存成果包括源码、数据库脚本、论文和演示资料。</p>
<p>做这个项目时，我开始关注用户如何完成一次操作，以及不同角色之间的业务怎样衔接。注册、审核、登录和报名是相互关联的流程，这也成为我从使用者角度思考产品的一个起点。</p>
<p><a href="/eames-book/project/club/">了解毕业设计项目</a></p>
<h2 id="在实际工作中积累经验">在实际工作中积累经验</h2>
<p>在小鹏汽车，我参与道路场景图像的分类、框选、复核与偏差修正。在鹏鼎控股，我担任智慧物流工程师，参与现场配置、测试与问题跟进。</p>
<p>把路线配置放到现场验证，把系统操作讲清楚，是我在智慧物流工作中持续练习的内容。</p>
<p><a href="/eames-book/experience/#career">查看职业经历与具体实践</a></p>
<h2 id="把兴趣延伸为项目">把兴趣延伸为项目</h2>
<p>影视是我的兴趣之一。了解到用户在记录观影、记录习惯和获取符合习惯的推荐方面存在不便后，我个人开发了「影迹」，将影视记录、Android 开发与 AI 探索结合起来。</p>
<p>目前，观影记录、观影习惯记录和基于习惯的影视推荐均已可用，项目仍在持续迭代。</p>
<p><a href="/eames-book/project/yingji/">了解「影迹」</a></p>
<h2 id="校园中的另一部分">校园中的另一部分</h2>
<p>在校期间，我担任班长、参与机器人协会工作，也参与过校园心理情景剧比赛。我的在校荣誉包括二等优秀学生干部、2026 届校级优秀毕业生；参与团队竞赛获得国家一等奖、省级三等奖，也在校园活动中获奖。</p>
<p><a href="/eames-book/experience/#honors">查看在校荣誉</a></p>
<h2 id="工作之外的片段">工作之外的片段</h2>
<p>影视、游戏与旅行也是我生活的一部分。2025 年的冬天，我一个人在海边散步；在游戏画面里，我也会留意中国风内容中的浪漫。</p>
<p><a href="/eames-book/interests/">看看兴趣与生活</a></p>
<h2 id="目前的探索">目前的探索</h2>
<p>目前，我专注学习与个人项目开发。</p>
<p>我想把已有的软件开发和工程实践经验联系起来，继续学习如何理解用户需求、梳理产品流程和验证方案，让 AI 能力与具体的使用场景衔接。</p>
<h2>随身携带的工具</h2><p>Kotlin · Jetpack Compose · Room · Java · SpringBoot · Vue · MySQL · Redis · Git · SolidWorks · AI API</p><a class="text-link" href="#/growth" data-go="growth">沿着时间继续阅读 →</a></article></section><section data-story="growth" data-chapter="growth" data-label="成长" data-kind="foldout"><article data-leaf><header class="chapter-heading"><span class="eyebrow">03 / ALONG THE WAY</span><h2>每一步尝试，<br>都算数。</h2></header><p class="serif-lead">没有预先写好的路线。</p><p>从大学，到团队竞赛、实习与独立开发。每一个节点，都是下一次尝试的起点。</p><div class="timeline-line" aria-hidden="true"><span>2022</span><i></i><span>2026</span></div><button class="foldout-toggle" data-fold-toggle aria-expanded="false">展开时间线折页 <span aria-hidden="true">↗</span></button><p class="margin-note">点击右页节点，读一段当时的故事。</p></article><article data-leaf class="timeline-leaf"><span class="eyebrow">A FEW MOMENTS THAT MATTER</span><div class="foldout-timeline"><details class="timeline-event" data-state-key="milestone-0"><summary><time>2022.09 — 2026.07</time><span>西安建筑科技大学华清学院</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>计算机科学与技术本科。入学时尚未明确未来方向，在不同领域的实践中持续探索。</p></div></details><details class="timeline-event" data-state-key="milestone-1"><summary><time>2023</time><span>大风机关 · 起重机创意赛国家一等奖</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>参赛作品「大风机关」获物流技术（起重机）创意赛国家一等奖。以团队成员身份参与舵机控制程序、钩爪零件建模／制作、图像识别调试与整机实践。</p><a href="/eames-book/project/crane/" class="text-link">查看竞赛作品 ↗</a></div></details><details class="timeline-event" data-state-key="milestone-2"><summary><time>2025.04 — 2025.07</time><span>小鹏汽车 · AI 训练数据标注实习生</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>参与道路场景图像标注、结果复核与偏差修正。</p><a href="/eames-book/experience/#career-xpeng" class="text-link">查看工作内容 ↗</a></div></details><details class="timeline-event" data-state-key="milestone-3"><summary><time>2026</time><span>独立完成社团管理平台毕业设计</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>围绕普通用户、社团用户和管理员三类角色，实现社团信息、申请审核、活动报名及参与记录等业务，完成前后端、数据库与设计材料。</p><a href="/eames-book/project/club/" class="text-link">查看毕业设计 ↗</a></div></details><details class="timeline-event" data-state-key="milestone-4"><summary><time>2026</time><span>持续开发个人项目「影迹」</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>个人开发 Android 应用「影迹」，将影视兴趣与 AI 产品探索结合；观影记录、观影习惯记录和基于习惯的影视推荐均已可用，持续迭代。</p></div></details><details class="timeline-event" data-state-key="milestone-5"><summary><time>2026.07 — 2026.10</time><span>鹏鼎控股 · 智慧物流工程师（实习）</span><i aria-hidden="true">+</i></summary><div class="timeline-detail"><p>参与智慧物流现场实施、系统配置、方案资料整理与问题跟进。</p><a href="/eames-book/experience/#career-pengding" class="text-link">查看工作内容 ↗</a></div></details></div><button class="foldout-collapse" data-fold-toggle>展开全部节点 ↗</button></article></section><section data-story="experience" data-chapter="experience" data-label="经历"><article data-leaf><header class="chapter-heading"><span class="eyebrow">04 / IN PRACTICE</span><h2>从课堂，<br>走向现场。</h2></header><p class="serif-lead">理解一件事，<br>也亲手做一遍。</p><div class="education-note"><span class="eyebrow">EDUCATION / 2022.09 — 2026.07</span><h3>西安建筑科技大学<br>华清学院</h3><p>计算机科学与技术 · 本科</p></div><p>在校期间担任班长、参与机器人协会工作。软件开发与工程实践，一起构成了我的学习经历。</p></article><article data-leaf><span id="career" class="eyebrow">FIELD NOTES / 职业实践</span><div class="career-index"><a href="#/experience/pengding" data-go="experience/pengding"><span class="entry-no">01</span><div><time>2026.07 — 2026.10</time><h3>鹏鼎控股</h3><p>智慧物流工程师 · 实习</p><span class="career-index-description">参与智慧物流现场实施、系统配置、方案资料整理与问题跟进。</span></div><span aria-hidden="true">↗</span></a><a href="#/experience/xpeng" data-go="experience/xpeng"><span class="entry-no">02</span><div><time>2025.04 — 2025.07</time><h3>小鹏汽车</h3><p>AI 训练数据标注实习生 · 实习</p><span class="career-index-description">参与道路场景图像标注、结果复核与偏差修正。</span></div><span aria-hidden="true">↗</span></a></div><a class="text-link" href="#/experience/honors" data-go="experience/honors">翻到在校荣誉 →</a></article></section><section data-story="experience/pengding" data-chapter="experience" data-label="鹏鼎控股" data-back="experience"><article data-leaf data-flow class="prose"><header id="career-pengding" class="chapter-heading"><span class="eyebrow">IN PRACTICE / 2026.07 — 2026.10</span><h2>鹏鼎控股</h2><p class="chapter-subtitle">智慧物流工程师 · 实习</p></header><p class="serif-lead">参与智慧物流现场实施、系统配置、方案资料整理与问题跟进。</p><h3>我参与的工作</h3><ul><li>参与 AGV 路线配置、任务模板配置和上下料测试。</li><li>整理方案与交付进度资料，参与现场踏勘和设备安装条件确认。</li><li>记录现场异常现象，配合设备厂商排查并跟进整改与复测。</li><li>向现场作业人员讲解 MCS 操作和路线使用。</li></ul><h3>一次路线配置与现场验证</h3><p>转运路线的配置需要与现场搬运过程配合。</p><p>完成路线配置，并进行跟车测试，核对实际运行情况。</p><p>该条线路在跟车测试中运行正常。</p><h3>带走的经验</h3><p>在现场配置和跟车测试中，加深了对路线规划与验证逻辑的理解；通过操作教育训练，练习把技术操作讲清楚。</p><button class="text-link" data-go="experience">← 返回经历</button></article></section><section data-story="experience/xpeng" data-chapter="experience" data-label="小鹏汽车" data-back="experience"><article data-leaf data-flow class="prose"><header id="career-xpeng" class="chapter-heading"><span class="eyebrow">IN PRACTICE / 2025.04 — 2025.07</span><h2>小鹏汽车</h2><p class="chapter-subtitle">AI 训练数据标注实习生 · 实习</p></header><p class="serif-lead">参与道路场景图像标注、结果复核与偏差修正。</p><h3>我参与的工作</h3><ul><li>按照标注规范，对车辆、行人和交通标志等目标进行分类与框选。</li><li>参与标注结果复核，修正分类或框选偏差。</li></ul><div class="work-highlight"><b>5000+<small>张</small></b><p>累计完成道路场景图像标注</p></div><h3>带走的经验</h3><p>在规范化标注、复核和偏差修正中，积累数据质量控制的实践经验。</p><button class="text-link" data-go="experience">← 返回经历</button></article></section><section data-story="experience/honors" data-chapter="experience" data-label="在校荣誉" data-back="experience"><article data-leaf data-flow><header id="honors" class="chapter-heading"><span class="eyebrow">HONORS / CAMPUS LIFE</span><h2>努力的注脚。</h2></header><div class="honors-ledger"><section><div class="honor-meta"><span>2026 届 / 个人荣誉</span><strong>校级</strong></div><h3>优秀毕业生</h3></section><section><div class="honor-meta"><span>2023 / 团队成果</span><strong>国家一等奖</strong></div><h3>中国大学生机械工程创新创意大赛</h3><p>“矿源杯”物流技术（起重机）创意赛</p><p>参赛作品「大风机关」，以团队成员身份参与。</p><p class="margin-note">证书落款：2023.08.30</p><a href="/eames-book/project/crane/" class="text-link">查看竞赛作品 ↗</a></section><section><div class="honor-meta"><span>2023 / 团队成果</span><strong>省级三等奖</strong></div><h3>中国大学生工程实践与创新能力大赛陕西赛区</h3><p>智能+赛道 · 智能物流搬运赛项</p><p class="margin-note">证书落款：2024.01</p></section><section><div class="honor-meta"><span>2022—2023 学年 / 个人荣誉</span><strong>校内荣誉</strong></div><h3>二等优秀学生干部</h3><p>在“争先创优”活动中获得。</p></section><section><div class="honor-meta"><span>2023.04 / 校园荣誉</span><strong>三等奖</strong></div><h3>第四届校园心理情景剧大赛</h3></section></div><button class="text-link" data-go="experience">← 返回经历</button></article></section><section data-story="projects" data-chapter="projects" data-label="项目" data-kind="projects"><article data-leaf class="projects-opener"><span class="eyebrow">05 / THINGS MADE</span><h2>让想法，<br>有迹可循。</h2><div class="projects-graphic" aria-hidden="true"><span>想</span><i>↘</i><span>做</span></div><p>从一款个人应用，<br>到一个软件系统，<br>再到一件能够运行的机械作品。</p><p class="margin-note">三次尝试，三种理解问题的方式。</p></article><article data-leaf class="project-index-leaf"><span class="eyebrow">SELECTED WORK / 作品索引</span><div class="project-index"><a class="project-entry project-entry--yingji" href="#/project/yingji" data-go="project/yingji"><span class="entry-no">01</span><div><span class="project-entry-type">PERSONAL APP</span><h3>影迹 · YingJi</h3><p>个人开发的 Android 观影应用，支持观影记录、观影习惯记录和基于习惯的影视推荐，三项功能均已可用。</p><span class="project-entry-status">已实现 · 持续迭代</span></div><span class="project-entry-arrow" aria-hidden="true">↗</span></a><a class="project-entry project-entry--club" href="#/project/club" data-go="project/club"><span class="entry-no">02</span><div><span class="project-entry-type">GRADUATION PROJECT</span><h3>大学生社团管理平台</h3><p>独立完成的社团管理毕业设计，以普通用户、社团用户和管理员三类角色，串联入社申请、活动报名与后续记录。</p><span class="project-entry-status">毕业设计 · 独立完成</span></div><span class="project-entry-arrow" aria-hidden="true">↗</span></a><a class="project-entry project-entry--crane" href="#/project/crane" data-go="project/crane"><span class="entry-no">03</span><div><span class="project-entry-type">ENGINEERING COMPETITION</span><h3>大风机关 · 起重机竞赛</h3><p>参与机械、程序与实物调试，团队获得国家一等奖（全国总决赛）。</p><span class="project-entry-status">2023 · 团队参赛</span></div><span class="project-entry-arrow" aria-hidden="true">↗</span></a></div></article></section><section data-story="project/yingji" data-chapter="projects" data-label="影迹 · YingJi" data-back="projects"><article data-leaf class="yingji-intro"><span class="eyebrow">SELECTED WORK 01 / YINGJI</span><h2>影迹 · YingJi</h2><p>个人开发的 Android 观影应用，支持观影记录、观影习惯记录和基于习惯的影视推荐，三项功能均已可用。</p><div class="app-screens"><figure class="book-photo book-photo--portrait"><a href="/eames-book/_astro/home.DgDaGkx2.png" data-image-viewer data-viewer-title="首页 · 观影记录" aria-label="放大查看：首页 · 观影记录"><img src="/eames-book/_astro/home.DgDaGkx2_ysUOp.webp" alt="影迹首页，列表中显示 Mock 演示作品 1，下方为明确标注 Mock 演示的 AI 区域" loading="lazy" decoding="async" width="960" height="1707"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>首页 · 观影记录</span><span>使用 Mock 示例作品展示记录列表与 AI 入口。</span></figcaption></figure><figure class="book-photo book-photo--portrait"><a href="/eames-book/_astro/search.DIeSGGAV.png" data-image-viewer data-viewer-title="搜索 · 组合筛选" aria-label="放大查看：搜索 · 组合筛选"><img src="/eames-book/_astro/search.DIeSGGAV_18WKUt.webp" alt="影迹搜索页，包含名称搜索、分类、标签、观看状态、观看时间和排序控件，下方是示例作品" loading="lazy" decoding="async" width="960" height="1707"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>搜索 · 组合筛选</span><span>名称、分类、标签、观看状态、时间与排序的查询入口。</span></figcaption></figure></div><p class="screen-note">真实 App 界面 · 独立验收版截图<br>画面使用示例作品，AI 入口为原有 Mock 演示。</p><p class="margin-note">翻页继续阅读项目记录。</p></article><article data-leaf data-flow class="prose project-story"><header class="chapter-heading"><span class="eyebrow">PERSONAL APP</span><h2>影迹 · YingJi</h2><p class="chapter-subtitle">已实现 · 持续迭代</p></header><p class="story-lead">个人开发的 Android 观影应用，支持观影记录、观影习惯记录和基于习惯的影视推荐，三项功能均已可用。</p><div class="technology-line">Kotlin / Jetpack Compose / MVVM / Room / Coroutines / Flow / DeepSeek API</div><h2 id="项目概述">项目概述</h2>
<p>「影迹」是一款面向个人使用的 Android 影视记录与智能观影应用，把影视兴趣、应用开发与 AI 产品探索结合起来。</p>
<p>项目由我个人开发完成。观影记录、观影习惯记录和基于观影习惯的影视作品推荐均已可用，目前仍在持续完善体验。</p>
<p>项目已开源：<a href="https://github.com/b2913336346-code/YingJi">查看 GitHub 源码与文档 ↗</a> · <a href="https://github.com/b2913336346-code/YingJi/releases">查看版本发布与 APK ↗</a></p>
<h2 id="为什么做影迹">为什么做影迹</h2>
<p>我了解到，一些用户在观看影视作品时，不便记录自己的观影记录与观影习惯，也希望能根据自己的习惯获得影视推荐。「影迹」围绕这些需求展开，让记录与推荐在同一款应用中衔接起来。</p>
<h2 id="我的角色">我的角色</h2>
<p>个人开发完成。</p>
<h2 id="目前可用的核心功能">目前可用的核心功能</h2>
<ul>
<li><strong>观影记录</strong>：记录观看过的影视作品。</li>
<li><strong>观影习惯</strong>：记录个人观影习惯。</li>
<li><strong>影视推荐</strong>：根据观影习惯推荐影视作品。</li>
</ul>
<h3 id="基础记录能力">基础记录能力</h3>
<ul>
<li><strong>作品管理</strong>：管理个人影视记录。</li>
<li><strong>分类与标签</strong>：通过分类和标签整理作品。</li>
<li><strong>观看状态</strong>：记录作品的观看状态。</li>
</ul>
<h2 id="ai-观影推荐">AI 观影推荐</h2>
<p>基于观影习惯的影视作品推荐已可用。项目已接入 DeepSeek API，并继续围绕个人观影记录与偏好探索观影画像。</p>
<h2 id="推荐如何形成">推荐如何形成</h2>
<ol>
<li><strong>准备候选</strong>：通过资料网关读取 TMDB 电影、剧集候选，并核对对应详情。</li>
<li><strong>确认偏好摘要</strong>：在个性化推荐前，向用户展示本次使用的画像摘要，确认后再发起模型请求。</li>
<li><strong>理解推荐方向</strong>：DeepSeek 根据偏好摘要提供主题方向与筛选条件。</li>
<li><strong>筛选与排序</strong>：应用依据候选资料、偏好和条件在本地完成筛选与排序。</li>
</ol>
<p>作品名称和详情来自影视资料源，模型输出限定为推荐方向与条件。</p>
<h2 id="产品定位">产品定位</h2>
<p>当前以个人使用为主，优先本地使用与成本控制，不以多用户商业化为第一目标。</p>
<h2 id="开发中遇到的难点">开发中遇到的难点</h2>
<p>难点在于让推荐对应到可核对的真实影视资料，并处理资料获取链路中的网络与异常问题。</p>
<p>目前，作品资料使用 TMDB 数据源，应用通过独立的资料网关读取候选、详情与海报，再核对作品信息。DeepSeek 提供偏好方向与筛选条件，应用据此对候选进行筛选和排序。</p>
<p>这一实现将影视资料、模型建议和本地排序分开处理。缺少有效候选时保留空结果，资料请求失败时提供错误反馈。资料源接入仍在持续完善与验证。</p>
<p>开发记录中曾出现上游直连受限，并记录过经代理完成本机只读验证的过程。资料网关的持续接入与验证，是这一部分后续完善的重点。</p>
<h2 id="当前进展">当前进展</h2>
<p>在已有基础记录与 AI 功能之上，继续完善交互、测试和功能体验。公开发布页已提供 v3.0.0，后续版本、安装包与更新说明以 GitHub Releases 为准。下方界面与视频来自独立验收版，不作为公开安装包的实测记录。</p>
<h3 id="真实调用与测试模式">真实调用与测试模式</h3>
<p>真实模型调用需要启用对应构建配置、配置模型凭据，并确认本次画像摘要；开发版本同时保留 Mock 测试模式。真实调用效果示例仍待补充。</p>
<h2 id="真实界面与演示">真实界面与演示</h2>

<p>大学生社团管理平台是我独立完成的毕业设计。它围绕高校社团的日常业务，把社团信息、入社申请、活动报名，以及参与后的签到、游记和评价放到同一个 Web 平台中。</p>
<h2 id="为什么做这个项目">为什么做这个项目</h2>
<p>社团信息、成员资料和活动记录分散时，申请进度与后续参与情况不容易衔接。这个项目希望把这些环节连接起来，让普通用户能够查询与提交申请，让社团负责人和管理员能够处理对应的业务记录。</p>
<h2 id="我的角色">我的角色</h2>
<p>我独立完成这份毕业设计，内容覆盖需求分析、数据库设计、用户端与管理端页面、后端接口和联调。留存成果包括前后端源码、数据库脚本、设计论文和演示视频。</p>
<h2 id="三类角色如何协作">三类角色如何协作</h2>
<ul>
<li><strong>普通用户</strong>：浏览社团与活动，提交入社申请和活动报名，在个人中心查看入社、退社、报名、签到等记录，并参与游记、评价与留言。</li>
<li><strong>社团用户</strong>：维护社团与活动信息，处理申请及参与记录，查看活动相关数据。</li>
<li><strong>系统管理员</strong>：管理用户、处理审核、维护公告和留言，并查询各类业务记录。</li>
</ul>
<h2 id="从注册到审核再到登录">从注册到审核再到登录</h2>
<p>演示视频保留了一条完整的社团用户处理流程：</p>
<ol>
<li>在用户端选择社团用户身份并提交注册信息。</li>
<li>新账号在管理端显示为「未审核」。</li>
<li>管理员处理后，账号状态更新为「已通过」。</li>
<li>账号通过审核后，回到用户端完成登录。</li>
</ol>
<p>后端登录处理会查询对应用户的审核状态，对未通过审核的账号返回提示。这条流程把注册表单、管理端处理、后端状态和登录反馈衔接起来。</p>
<ul class="life-gallery" aria-label="社团账号审核前后" role="list"><li><figure class="life-image"><a class="life-image-link" href="/eames-book/_astro/club-review-pending.CeUKOrWW_Z2hppfF.webp" aria-label="查看「审核前 · 未审核」大图" data-image-viewer data-viewer-title="审核前 · 未审核"><img src="/eames-book/_astro/club-review-pending.CeUKOrWW_Z2hppfF.webp" srcset="/eames-book/_astro/club-review-pending.CeUKOrWW_Z1tnfx.webp 480w, /eames-book/_astro/club-review-pending.CeUKOrWW_Z2hppfF.webp 959w" alt="新注册社团演示账号的状态为未审核，卡片下方提供审核入口，姓名和手机号字段为空" sizes="(max-width: 760px) calc(100vw - 40px), (max-width: 1120px) calc((100vw - 88px) / 2), 516px" loading="lazy" decoding="async" width="959" height="355"></a><figcaption><h3>审核前 · 未审核</h3><p>演示中新注册的社团账号，等待管理员处理。</p></figcaption></figure></li><li><figure class="life-image"><a class="life-image-link" href="/eames-book/_astro/club-review-approved.BH3wnJsv_V6wuS.webp" aria-label="查看「审核后 · 已通过」大图" data-image-viewer data-viewer-title="审核后 · 已通过"><img src="/eames-book/_astro/club-review-approved.BH3wnJsv_V6wuS.webp" srcset="/eames-book/_astro/club-review-approved.BH3wnJsv_295i0z.webp 480w, /eames-book/_astro/club-review-approved.BH3wnJsv_V6wuS.webp 959w" alt="同一社团演示账号的审核状态变为已通过，姓名和手机号字段为空" sizes="(max-width: 760px) calc(100vw - 40px), (max-width: 1120px) calc((100vw - 88px) / 2), 516px" loading="lazy" decoding="async" width="959" height="355"></a><figcaption><h3>审核后 · 已通过</h3><p>同一演示账号完成审核，状态更新为已通过。</p></figcaption></figure></li></ul>
<h2 id="活动报名与后续记录">活动报名与后续记录</h2>
<p>报名接口包含活动人数上限和截止时间检查，保存报名记录后更新活动名额。报名、取消、签到、游记与评价分别保留对应的业务记录，便于用户和管理人员查询不同阶段的信息。</p>
<h2 id="技术实现">技术实现</h2>
<p>用户端与管理端分别维护为两个 Vue 3 前端工程，使用 Vite 构建。Spring Boot 后端提供业务接口，MyBatis-Plus 配合 MySQL 处理数据读写，Redis 保存登录令牌。</p>
<p>页面、控制层、服务层和数据访问层围绕用户、社团、活动及各类记录组织，方便逐个梳理业务之间的关系。</p>
<h2 id="真实界面">真实界面</h2>
<p>以下画面截取自留存的演示录屏，可以点击查看大图。</p>
<ul class="life-gallery life-gallery--stack" aria-label="社团管理平台真实界面" role="list"><li><figure class="life-image"><a class="life-image-link" href="/eames-book/_astro/club-user-center.kH29RROq_Z1ULVU2.webp" aria-label="查看「普通用户端 · 个人中心」大图" data-image-viewer data-viewer-title="普通用户端 · 个人中心"><img src="/eames-book/_astro/club-user-center.kH29RROq_H68zD.webp" srcset="/eames-book/_astro/club-user-center.kH29RROq_ZtKvYP.webp 480w, /eames-book/_astro/club-user-center.kH29RROq_H68zD.webp 960w, /eames-book/_astro/club-user-center.kH29RROq_Z1ULVU2.webp 1136w" alt="社团管理平台普通用户端，左侧列出各类个人记录，右侧是退社记录查询页面" sizes="(max-width: 760px) calc(100vw - 40px), (max-width: 854px) calc(100vw - 64px), 790px" loading="lazy" decoding="async" width="960" height="482"></a><figcaption><h3>普通用户端 · 个人中心</h3><p>录屏截帧：入社、退社、报名、签到等记录的查询入口。</p></figcaption></figure></li><li><figure class="life-image"><a class="life-image-link" href="/eames-book/_astro/club-admin-form.DqnBFpib_Z2v9yMC.webp" aria-label="查看「管理端 · 用户信息表单」大图" data-image-viewer data-viewer-title="管理端 · 用户信息表单"><img src="/eames-book/_astro/club-admin-form.DqnBFpib_Z11oURi.webp" srcset="/eames-book/_astro/club-admin-form.DqnBFpib_vQeBb.webp 480w, /eames-book/_astro/club-admin-form.DqnBFpib_Z11oURi.webp 960w, /eames-book/_astro/club-admin-form.DqnBFpib_BlUwb.webp 1600w" alt="社团管理平台管理端的空白用户信息表单，包含头像、用户名、昵称、邮箱和状态等字段" sizes="(max-width: 760px) calc(100vw - 40px), (max-width: 854px) calc(100vw - 64px), 790px" loading="lazy" decoding="async" width="960" height="529"></a><figcaption><h3>管理端 · 用户信息表单</h3><p>录屏截帧：截取空白表单区域，展示用户信息维护界面。</p></figcaption></figure></li></ul>
<h2 id="回看这份毕业设计">回看这份毕业设计</h2>
<p>项目把多角色协作和业务记录串联到了一起。后续仍有可以继续完善的方向，例如移动端适配、推荐方式和数据查询优化；这些也是论文总结中保留的改进方向。</p><div class="article-links"><a href="#/journal/club-workflow" data-go="journal/club-workflow">日志 / 社团平台：把注册与审核串起来 ↗</a></div><button class="text-link" data-go="projects">← 返回项目</button></article></section><section data-story="project/crane" data-chapter="projects" data-label="大风机关 · 起重机竞赛" data-back="projects"><article data-leaf data-flow class="prose project-story"><header class="chapter-heading"><span class="eyebrow">ENGINEERING COMPETITION</span><h2>大风机关 · 起重机竞赛</h2><p class="chapter-subtitle">2023 · 团队参赛</p></header><p class="story-lead">参与机械、程序与实物调试，团队获得国家一等奖（全国总决赛）。</p><div class="technology-line">C / STC8H / SolidWorks / 3D 打印</div><h2 id="项目概述">项目概述</h2>
<p>2023 年，我作为团队成员，携作品「大风机关」参加中国大学生机械工程创新创意大赛“矿源杯”物流技术（起重机）创意赛，团队获得国家一等奖（全国总决赛）。</p>
<p>获奖证书列有我的姓名，证书落款为 2023 年 8 月 30 日。</p>
<p>这是一段将机械结构、控制程序与实物调试结合的实践经历。留存资料包括控制工程、机械设计文件，以及参赛说明中的作品实拍。</p>
<h2 id="机械结构与制作">机械结构与制作</h2>
<p>机械设计资料保留了机械臂与夹爪的 SolidWorks 装配体，以及底座、车体等零件文件，呈现作品结构设计中的不同部分。</p>
<p>加工相关资料包括 STL 模型和 DXF 图纸，涵盖底座、支撑件、连接件与车轮相关零件。建模、制作与组装共同构成实物作品的实现过程。</p>
<h2 id="控制工程">控制工程</h2>
<p>留存的机械臂控制工程使用 C 语言，基于 STC8H 单片机。代码包含串口指令解析、PWM 输出与舵机控制、步进电机运动规划，以及机械臂坐标计算等内容。</p>
<p>这些文件为理解作品的控制方式提供了依据；整套控制工程与机械设计属于团队作品资料。</p>
<h2 id="我的贡献">我的贡献</h2>
<p>我在团队中的工作集中在以下部分：</p>
<ul>
<li><strong>舵机控制</strong>：负责舵机控制程序。</li>
<li><strong>钩爪零件</strong>：参与零件建模／制作相关工作。</li>
<li><strong>图像识别</strong>：参与图像识别调试。</li>
<li><strong>整机实践</strong>：参与组装布线／整机联调相关工作。</li>
</ul>
<p>实践涉及 SolidWorks 三维建模、3D 打印、组装布线与反复测试。</p>
<h2 id="个人感受">个人感受</h2>
<p>把最初的想法转化成能够实际运行的作品，是这段经历中最有成就感的部分。</p>
<h2 id="项目素材">项目素材</h2>
<figure class="project-photo project-media"><a href="/eames-book/images/projects/crane/competition-work-02.jpg" aria-label="查看竞赛作品原图" data-image-viewer="true" data-viewer-title="大风机关 · 竞赛作品原图"><img src="/eames-book/images/projects/crane/competition-work-02.jpg" alt="参赛机械作品实拍，展示竖向机械臂、钩爪、底座与布线" width="612" height="459" loading="lazy" decoding="async"/></a><figcaption>竞赛作品实拍 · 整机结构（点击查看原图）</figcaption></figure>
<h2 id="竞赛现场视频">竞赛现场视频</h2>
<p id="crane-audio-note">现场实录，约 3 分 02 秒。保留现场环境声和零散交谈，没有专门解说。点击播放器可播放、暂停或全屏观看。</p>

状态等基础能力。</p><h2 id="围绕观影记录展开">围绕观影记录展开</h2>
<p>开发「影迹」的出发点，是了解到用户在记录观影记录、记录观影习惯，以及根据习惯获得影视推荐方面存在不便。项目由我个人开发完成。</p>
<p>目前，观影记录与观影习惯记录均已可用。</p>
<h2 id="基础功能">基础功能</h2>
<p>实现作品管理、分类、标签、观看状态等基础能力。</p>
<p>界面截图与 90 秒功能演示已整理，使用独立验收版的示例作品展示记录、搜索和管理界面。</p>
<p><a href="/eames-book/project/yingji/#yingji-showcase">查看界面与演示</a></p>
<p>具体开发日期与个人版版本号仍待补充；素材录制日期不作为开发完成日期。</p>
<div class="article-links"><a href="#/project/yingji" data-go="project/yingji">相关项目 / 影迹 · YingJi ↗</a></div><button class="text-link" data-go="journal">← 返回日志</button></article></section><section data-story="journal/yingji-ai" data-chapter="journal" data-label="AI 能力集成" data-back="journal"><article data-leaf data-flow class="prose journal-story"><header class="chapter-heading"><span class="eyebrow">WORKING NOTES / 阶段记录 · 日期待补充</span><h2>AI 能力集成</h2></header><p class="story-lead">已接入 DeepSeek API，基于观影习惯的影视推荐已可用；开发中的主要难点是推荐数据来源。</p><h2 id="ai-能力集成">AI 能力集成</h2>
<p>项目已接入 DeepSeek API。基于观影习惯推荐影视作品的功能已可用，同时继续围绕个人观影记录与偏好探索观影画像。</p>
<h2 id="开发中遇到的难点">开发中遇到的难点</h2>
<p>影视作品推荐的数据来源，是开发过程中的主要难点。当前方案使用 TMDB 提供作品候选和详情，应用通过资料网关读取并核对信息；DeepSeek 提供偏好方向和筛选条件，应用在本地完成候选筛选与排序。</p>
<p>资料接入还涉及网络连通性与异常处理。现有开发记录包含上游直连受限、经代理完成本机只读验证的过程；当前代码正在持续完善网关接入。</p>
<h2 id="调用与确认">调用与确认</h2>
<p>源码提供真实调用和 Mock 测试模式。真实个性化推荐需要相应构建配置、模型凭据与用户对本次画像摘要的确认。</p>
<h2 id="演示与待补记录">演示与待补记录</h2>
<p>已整理独立验收版的界面截图与 90 秒功能演示。AI 片段为 Mock 本地虚构演示，展示结果、反馈与加入流程，不代表真实模型或 TMDB 推荐结果。</p>
<p><a href="/eames-book/project/yingji/#yingji-showcase">查看 Mock 界面与功能演示</a></p>
<p>真实调用效果、具体集成日期、个人版版本号与完整测试记录仍待实际资料补充。</p>
<div class="article-links"><a href="#/project/yingji" data-go="project/yingji">相关项目 / 影迹 · YingJi ↗</a></div><button class="text-link" data-go="journal">← 返回日志</button></article></section><section data-story="journal/yingji-iteration" data-chapter="journal" data-label="持续迭代" data-back="journal"><article data-leaf data-flow class="prose journal-story"><header class="chapter-heading"><span class="eyebrow">WORKING NOTES / 当前阶段</span><h2>持续迭代</h2></header><p class="story-lead">继续完善交互、测试与功能体验，已整理独立验收版界面与功能演示。</p><h2 id="当前阶段">当前阶段</h2>
<p>继续完善交互、测试与功能体验。源码与公开开发文档已在 <a href="https://github.com/b2913336346-code/YingJi">GitHub 仓库</a> 开源，<a href="https://github.com/b2913336346-code/YingJi/releases">公开发布页</a> 已提供 v3.0.0；后续版本、安装包与更新说明以发布页为准。</p>
<p>已整理 2026 年 11 月 6 日录制的独立验收版 3.0.0-uiacceptance 素材，包括四张界面截图和新版 90 秒功能演示。AI 部分明确标注为 Mock 本地虚构演示；录制日期和验收版版本不作为个人版的开发日期或发布版本。</p>
<p><a href="/eames-book/project/yingji/#yingji-showcase">查看本次界面与演示</a></p>
<div class="article-links"><a href="#/project/yingji" data-go="project/yingji">相关项目 / 影迹 · YingJi ↗</a></div><button class="text-link" data-go="journal">← 返回日志</button></article></section><section data-story="journal/club-workflow" data-chapter="journal" data-label="社团平台：把注册与审核串起来" data-back="journal"><article data-leaf data-flow class="prose journal-story"><header class="chapter-heading"><span class="eyebrow">WORKING NOTES / 项目回顾 · 开发日期待补充</span><h2>社团平台：把注册与审核串起来</h2></header><p class="story-lead">回顾独立完成的毕业设计，梳理社团用户注册、管理员审核与登录状态之间的关系。</p><h2 id="一次注册跨越两个界面">一次注册跨越两个界面</h2>
<p>这份毕业设计由我独立完成。用户端负责提交注册信息，管理端负责处理社团账号的审核，后端保存账号与审核状态。</p>
<p>账号注册完成后，管理端显示「未审核」；管理员处理后，状态更新为「已通过」。留存演示展示了这个变化，以及账号随后回到用户端登录的过程。</p>
<h2 id="状态与反馈需要衔接">状态与反馈需要衔接</h2>
<p>后端登录处理会读取账号所属用户组及对应的审核状态。未通过审核时返回提示，通过审核后继续登录流程，并将登录令牌保存在 Redis 中。</p>
<p>这条链路涉及前端表单、管理端操作、状态存储与登录反馈。把这些环节放在同一个流程中检查，能够看清一次操作如何影响后续页面。</p>
<h2 id="报名也有自己的业务规则">报名也有自己的业务规则</h2>
<p>活动报名接口检查人数上限与截止时间，保存报名记录后更新活动名额。用户后续的取消、签到、游记与评价分别进入对应记录模块。</p>
<p>这些实现让项目的关注点从单个表单延伸到了业务之间的衔接。具体开发日期仍待补充，这篇记录依据留存源码、论文和演示作项目回顾。</p>

-photo"><a href="/eames-book/_astro/seagulls.k71zFQQg.webp" data-image-viewer data-viewer-title="掠过海面的海鸥" aria-label="放大查看：掠过海面的海鸥"><img src="/eames-book/_astro/seagulls.k71zFQQg_1BojaH.webp" alt="几只海鸥近距离掠过镜头，背景是灰蓝色天空与海浪" loading="lazy" decoding="async" width="960" height="719"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>掠过海面的海鸥</span><span>贴近镜头的翅膀，身后是翻涌的海浪。</span></figcaption></figure><p class="serif-lead">海浪、海鸥，<br>还有城市的一角。</p></article><article data-leaf data-flow class="photo-collection"><figure class="book-photo"><a href="/eames-book/_astro/city-window.DYhRCNGE.webp" data-image-viewer data-viewer-title="城市一角" aria-label="放大查看：城市一角"><img src="/eames-book/_astro/city-window.DYhRCNGE_ZDosNp.webp" alt="从弧形露台望向城市，高楼、红色屋顶与远处海湾同框" loading="lazy" decoding="async" width="960" height="720"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>城市一角</span><span>透过弧形露台，望向城市与海。</span></figcaption></figure><figure class="book-photo"><a href="/eames-book/_astro/breaking-waves.CjmugpSY.webp" data-image-viewer data-viewer-title="浪花靠岸" aria-label="放大查看：浪花靠岸"><img src="/eames-book/_astro/breaking-waves.CjmugpSY_1Il6eS.webp" alt="白色浪花在带铁链的石栏后升起，水雾覆盖海岸" loading="lazy" decoding="async" width="960" height="719"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>浪花靠岸</span><span>海浪越过石栏，留下水雾。</span></figcaption></figure><figure class="book-photo"><a href="/eames-book/_astro/winter-harbor.CEfaTRho.webp" data-image-viewer data-viewer-title="海边散步" aria-label="放大查看：海边散步"><img src="/eames-book/_astro/winter-harbor.CEfaTRho_Z1M7hg0.webp" alt="暖色天空下的海湾，水面停着小船，右侧是临海步道的栏杆" loading="lazy" decoding="async" width="960" height="720"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>海边散步</span><span>水面、船只和一段临海步道。</span></figcaption></figure><button class="text-link" data-go="interests">← 返回兴趣</button></article></section><section data-story="interests/games" data-chapter="interests" data-label="电子游戏" data-back="interests"><article data-leaf><span class="eyebrow">GAMING / 影之刃零</span><h2>中国风里的<br>浪漫。</h2><figure class="book-photo"><a href="/eames-book/_astro/game-sunset.kKHd3-vc.webp" data-image-viewer data-viewer-title="夕照与江湖" aria-label="放大查看：夕照与江湖"><img src="/eames-book/_astro/game-sunset.kKHd3-vc_Z2hL4w4.webp" alt="《影之刃零》游戏画面：斗笠人物站在水边，远处是夕阳、山峦与亭阁" loading="lazy" decoding="async" width="960" height="600"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>夕照与江湖</span><span>《影之刃零》 · 游戏画面</span></figcaption></figure><p class="serif-lead">中国风的内容，中国人才懂得浪漫。</p></article><article data-leaf><figure class="book-photo"><a href="/eames-book/_astro/game-temple.BoDaWLIq.webp" data-image-viewer data-viewer-title="烛火与旧殿" aria-label="放大查看：烛火与旧殿"><img src="/eames-book/_astro/game-temple.BoDaWLIq_Z1JQloo.webp" alt="《影之刃零》游戏画面：人物走入木构殿堂，烛火照亮昏暗的内部空间" loading="lazy" decoding="async" width="960" height="600"><span class="photo-expand" aria-hidden="true">↗</span></a><figcaption><span>烛火与旧殿</span><span>《影之刃零》 · 游戏画面</span></figcaption></figure><h3>收藏一个画面。</h3><p>偏爱开放世界与角色扮演，也广泛体验主机游戏、3A 大作、FPS 等类型。</p><p class="margin-note">《影之刃零》游戏画面收藏。</p><button class="text-link" data-go="interests">← 返回兴趣</button></article></section><section data-story="interests/cinema" data-chapter="interests" data-label="影视与动漫" data-back="interests"><article data-leaf><span class="eyebrow">CINEMA / STORIES</span><h2>故事之外，<br>还有回声。</h2><p class="serif-lead">电影、电视剧与动漫涉猎广泛，没有固定类型偏好。</p><p>把影视兴趣延伸成个人项目，便有了「影迹」。</p><a class="cinema-project-link" href="#/project/yingji" data-go="project/yingji"><span>影迹</span><small>YINGJI / PERSONAL APP</small><span aria-hidden="true">↗</span></a></article><article data-leaf><span class="eyebrow">MY WATCHLIST / 片单随想</span><div class="cinema-notes"><section><span class="entry-no">01</span><h3>EVA</h3><h4>人与人的距离</h4><p>渴望被理解，又害怕在靠近中受伤。EVA 把这种矛盾放进人与人的关系里，也把问题带回自身：怎样面对不安，怎样接受自己的不完整。</p></section><section><span class="entry-no">02</span><h3>肖申克的救赎</h3><h4>希望，需要时间</h4><p>希望在漫长的日子里一点点落地：认真做事，保留选择，为尚未到来的自由做好准备。故事里的坚持，让时间拥有了方向。</p></section><section><span class="entry-no">03</span><h3>权力的游戏</h3><h4>每一次选择都有代价</h4><p>家族、承诺与生存，把人物推向不同的选择。权力在这些选择之间流动，后果又不断改变局势。复杂的人心与彼此牵连的命运，让这个世界值得反复思考。</p></section></div><button class="text-link" data-go="interests">← 返回兴趣</button></article></section><section data-story="contact" data-chapter="contact" data-label="联系"><article data-leaf class="contact-opener"><span class="eyebrow">08 / KEEP IN TOUCH</span><h2>下一段对话，<br>从这里开始。</h2><p class="serif-lead">关于作品，关于想法，<br>也关于正在探索的方向。</p><div class="contact-signature">Eames<span>卜文旭</span></div><p class="margin-note">这本书还没有写完。<br>下一页，留给新的尝试。</p></article><article data-leaf data-flow><span class="eyebrow">THE CONTACT CARD</span><div class="contact-card"><span class="contact-card-mark">e.</span><h3>卜文旭 / Eames</h3><p>探索 · 思考 · 创造</p><div class="contact-list"><div class="contact-row"><span>邮箱 Email</span><div><button class="copy-contact" data-copy="2913336346@qq.com">2913336346@qq.com<span aria-hidden="true">⧉</span></button><a class="email-compose" href="mailto:2913336346@qq.com">写邮件 ↗</a></div></div><div class="contact-row"><span>GitHub</span><a href="https://github.com/b2913336346-code" target="_blank" rel="noreferrer">b2913336346-code ↗</a></div><div class="contact-row"><span>哔哩哔哩</span><a href="https://space.bilibili.com/402939839" target="_blank" rel="noreferrer">402939839 ↗</a></div><div class="contact-row"><span>小红书</span><div><span>63008154925</span><a class="contact-card-image" href="/eames-book/images/contact/rednote-card.png" data-image-viewer data-viewer-title="小红书完整名片" data-viewer-alt="小红书完整名片与二维码">查看名片与二维码 ↗</a></div></div><div class="contact-row"><span>微信</span><div><span>糖炒栗子</span><a class="contact-card-image" href="/eames-book/images/contact/wechat-card.jpg" data-image-viewer data-viewer-title="微信完整名片" data-viewer-alt="微信完整名片与二维码">查看名片与二维码 ↗</a></div></div><div class="contact-row"><span>抖音</span><div><span>b2913336346</span><a class="con
